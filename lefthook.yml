min_version: "2.1.17"
lefthook: ./node_modules/.bin/lefthook
glob_matcher: doublestar

pre-commit:
  parallel: false
  jobs:
    - name: kotlin
      glob: "**/*.{kt,kts}"
      exclude: "**/build/**"
      run: node scripts/repo-tools/scripts/hook-files.mjs kotlin {staged_files}
      stage_fixed: true
    - name: text
      glob: "**/*.{md,json,yml,yaml,js,cjs,mjs,ts,tsx,jsx,xml}"
      exclude: "{**/build/**,**/dist/**,**/.next/**,**/.turbo/**,pnpm-lock.yaml}"
      run: node scripts/repo-tools/scripts/hook-files.mjs text {staged_files}
      stage_fixed: true
    - name: toml
      glob: "**/*.toml"
      exclude: "**/build/**"
      run: node scripts/repo-tools/scripts/hook-files.mjs toml {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: ./node_modules/.bin/commitlint --config scripts/repo-tools/config/commitlint.config.cjs --edit "{1}"
