min_version: "2.1.17"
lefthook: ./node_modules/.bin/lefthook
glob_matcher: doublestar

pre-commit:
  parallel: false
  jobs:
    - name: kotlin
      glob: "**/*.{kt,kts}"
      exclude: "**/build/**"
      run: node scripts/repo-tools/scripts/hook-files.ts kotlin {staged_files}
      stage_fixed: true
    - name: text
      glob: "**/*.{md,json,jsonc,yml,yaml,js,cjs,mjs,ts,mts,cts,tsx,jsx,astro,css,html}"
      exclude: "{**/build/**,**/dist/**,**/.next/**,**/.turbo/**,pnpm-lock.yaml}"
      run: node scripts/repo-tools/scripts/hook-files.ts text {staged_files}
      stage_fixed: true
    - name: xml
      glob: "**/*.xml"
      exclude: "**/build/**"
      run: node scripts/repo-tools/scripts/hook-files.ts xml {staged_files}
    - name: toml
      glob: "**/*.toml"
      exclude: "**/build/**"
      run: node scripts/repo-tools/scripts/hook-files.ts toml {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: ./node_modules/.bin/commitlint --config scripts/repo-tools/config/commitlint.config.ts --edit "{1}"
