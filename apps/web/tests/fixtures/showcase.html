<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body style="margin: 0; background: #101820">
    <script>
      // 按 KMP 展示入口的真实桥接协议回报；行为由父页面的 __showcaseFixture 控制。
      const attempt = Number(new URLSearchParams(location.search).get("attempt"));
      const control = window.parent.__showcaseFixture ?? { mode: "ready", calls: [] };
      const emit = (type, detail) => window.parent.dispatchEvent(new CustomEvent(type, { detail }));
      window.GazeKeepWebShowcaseBridge = {
        setScreen(route, revision, restore = false) {
          control.calls.push(restore ? ["setScreen", route, true] : ["setScreen", route]);
          requestAnimationFrame(() => emit("gazekeep:rendered", { route, revision, attempt }));
        },
        setDemoStatus(status) {
          control.calls.push(["setDemoStatus", status]);
        },
        setLocaleAndTheme(locale, dark) {
          control.calls.push(["setLocaleAndTheme", locale, dark]);
        },
      };
      // 与 ComposeViewport 一致：画布位于开放 shadow root 中，记录父页面转发的指针事件。
      const host = document.body.appendChild(document.createElement("div"));
      const canvas = host.attachShadow({ mode: "open" }).appendChild(document.createElement("canvas"));
      canvas.style.cssText = "display: block; width: 392px; height: 784px";
      for (const type of ["pointerdown", "pointermove", "pointerup"])
        canvas.addEventListener(type, (e) => {
          control.calls.push(["pointer", type, e.clientX, e.clientY]);
          control.calls.push(["offset", type, e.offsetX, e.offsetY]);
        });
      const mode = control.modes?.shift() ?? control.mode;
      if (mode === "ready") emit("gazekeep:ready", { attempt });
      else if (mode === "error") emit("gazekeep:error", { attempt });
    </script>
  </body>
</html>
