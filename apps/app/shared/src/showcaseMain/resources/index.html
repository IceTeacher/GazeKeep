<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--SHOWCASE_PRELOAD-->
    <style>
      html,
      body,
      #showcase {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #101318;
      }
    </style>
  </head>
  <body>
    <div id="showcase"></div>
    <script>
      const fallbackLang = navigator.language || "zh";
      const resolveLang = () => {
        const q = new URLSearchParams(location.search).get("lang");
        if (q) return q;
        try {
          const p = window.parent && window.parent !== window ? window.parent.document.documentElement.lang : "";
          if (p) return p;
        } catch {}
        return document.documentElement.lang || fallbackLang;
      };
      document.documentElement.lang = resolveLang();
      Object.defineProperty(navigator, "languages", {
        configurable: true,
        get: () => [resolveLang()],
      });
      const attempt = Number(new URLSearchParams(location.search).get("attempt"));
      const reportError = () => {
        if (window.parent && window.parent !== window) {
          window.parent.dispatchEvent(new CustomEvent("gazekeep:error", { detail: { attempt } }));
        }
      };
      const origGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function () {
        const ctx = origGetContext.apply(this, arguments);
        if (this && !this.__gazekeepWatched) {
          this.__gazekeepWatched = true;
          this.addEventListener("webglcontextlost", () => {
            setTimeout(() => {
              if (ctx && typeof ctx.isContextLost === "function" && ctx.isContextLost()) reportError();
            }, 1500);
          });
          this.addEventListener("webglcontextcreationerror", reportError);
        }
        return ctx;
      };
      window.addEventListener("error", reportError);
      window.addEventListener("unhandledrejection", reportError);
    </script>
    <!--SHOWCASE_ENTRY-->
  </body>
</html>
