name: pipeline

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  # 只取消被新提交取代的 PR 运行；分支与 tag 的发布不中途打断。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# tag 发版见 release.yml：它只在本流水线已通过 main 上同一提交后构建签名 APK，不再重复回归。

jobs:
  changes:
    name: Detect changes
    # 各 job 固定 runner 镜像版本：ubuntu-latest 会随 GitHub 迁移到新系统，Android SDK、Docker 与 APK 工具随之变化。
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # 复用判断需查询本流水线的历史运行。
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.detect.outputs.app }}
      web: ${{ steps.detect.outputs.web }}
      full: ${{ steps.detect.outputs.full }}
      verified: ${{ steps.detect.outputs.verified }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Detect affected areas
        id: detect
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base='' head="$GITHUB_SHA" reuse=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA" head="$PR_HEAD_SHA" reuse=(--reuse)
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            base="$PUSH_BEFORE_SHA" reuse=(--reuse)
          fi
          # WHY：手动触发用于主动全量回归，不复用历史结果；空 base 由脚本按全量回归处理。
          # verified=true 表示同一棵树已有成功的 push 运行（dev 推送后开 PR、合并到 main、合并后同步 dev），
          # 此时跳过 Android 与官网测试，main 仍构建官网用于生产发布。
          node scripts/repo-tools/scripts/ci-changes.ts --base "$base" --head "$head" "${reuse[@]}" --output "$GITHUB_OUTPUT"

  repo:
    name: Repository checks
    needs: changes
    # PR 仍按 main 基线核对提交区间；其余已验证的树在原运行中检查过同样的提交。
    if: needs.changes.outputs.verified != 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          java: "true"
      - name: Install tools and Git hooks
        run: |
          set -euo pipefail
          pnpm tools:setup
          pnpm hooks:install
          pnpm verify:hooks
      - name: Verify docs, agent assets architecture and LSPosed metadata
        run: |
          set -euo pipefail
          pnpm verify:docs
          pnpm verify:agent-assets
          pnpm verify:architecture
          pnpm verify:lsposed-repo
      - name: Check formatting, lint and tool tests
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm --filter @gazekeep/repo-tools lint
          pnpm test:tools
      - name: Check commit messages and whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          to="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            from="$PR_BASE_SHA" to="$PR_HEAD_SHA"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/heads/* ]] &&
            [ -n "$PUSH_BEFORE_SHA" ] && ! [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]] &&
            git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            from="$PUSH_BEFORE_SHA"
          else
            # WHY：首次推送、强推与手动触发没有可用的 before；固定到主线共同祖先，避免空基线绕过门禁。
            from="$(git merge-base origin/main "$to")"
          fi
          echo "commit range: $from..$to"
          # WHY：main 上的手动触发与主线共同祖先即自身，区间为空；这些提交已在分支推送时校验。
          if [ "$from" = "$to" ]; then
            echo "提交区间为空，跳过"
            exit 0
          fi
          pnpm verify:commits --from "$from" --to "$to"
          git diff --check "$from" "$to"

  # WHY：仓库门禁先行，失败时不再消耗 Android 与官网的长构建；repo 因复用而跳过时视为通过。
  app:
    name: Android app
    needs: [changes, repo]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (needs.repo.result == 'success' || needs.repo.result == 'skipped') &&
      needs.changes.outputs.app == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          java: "true"
          gradle: "true"
          kotlin-js: "true"
      # 主机门禁含 Debug 构建、lint、主机测试与实机套件编译；实机运行不进入 CI。
      - name: Verify Android app
        run: pnpm --filter @gazekeep/app verify
      # Gradle 默认不输出 Yarn 日志；失败时保留 Kotlin/JS 安装目录的 Yarn 错误日志供排查。
      - name: Collect Yarn error logs
        if: failure()
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/yarn-logs"
          mkdir -p "$dest"
          find "$HOME/.kotlin/kotlin-npm-tooling" apps/app/build/js apps/app/build/wasm -maxdepth 3 \
            \( -name yarn-error.log -o -name package.json -o -name yarn.lock \) -not -path '*/node_modules/*' \
            -exec cp --parents {} "$dest" \; 2>/dev/null || true
      - name: Upload Yarn error logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-yarn-logs
          path: ${{ runner.temp }}/yarn-logs
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Website
    needs: [changes, repo]
    # 已验证的树只在 main 上重新构建，供生产发布使用。
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (needs.repo.result == 'success' || needs.repo.result == 'skipped') && needs.changes.outputs.web == 'true' &&
      (needs.changes.outputs.verified != 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          java: "true"
          gradle: "true"
          kotlin-js: "true"
      # 完整构建先生成 KMP Showcase，再执行依赖其产物的测试与检查。
      # 浏览器与截图测试在锁定版本的 Playwright 镜像中运行，与本地录制基线的字体和 Chromium 一致。
      - name: Build website
        run: pnpm --filter web build
      - name: Run unit tests
        if: needs.changes.outputs.verified != 'true'
        run: pnpm --filter web test:unit
      - name: Run browser tests in Playwright container
        if: needs.changes.outputs.verified != 'true'
        run: pnpm --filter web test:browser:docker
      - name: Lint website
        if: needs.changes.outputs.verified != 'true'
        run: pnpm --filter web lint
      - name: Type-check website
        if: needs.changes.outputs.verified != 'true'
        run: pnpm --filter web check
      - name: Upload website build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  web-preview:
    name: Deploy website preview
    needs: [app, web]
    # WHY：fork PR 拿不到 secret，只跑门禁；所有门禁通过（Android 未触发视为通过）才发布预览。
    # app 与 web 都依赖 repo，web 成功即说明仓库门禁已通过，或该树已由成功的运行验证。
    if: >-
      !cancelled() && needs.web.result == 'success' &&
      (needs.app.result == 'success' || needs.app.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: web-preview
      url: ${{ steps.deploy.outputs.deployment_url }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: web-preview-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Download website build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - id: deploy
        name: Deploy preview to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT: ${{ vars.EDGEONE_PROJECT }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for name in EDGEONE_API_TOKEN EDGEONE_PROJECT; do
            if [ -z "${!name:-}" ]; then
              echo "web-preview 环境缺少配置：$name" >&2
              exit 1
            fi
          done
          # 打包脚本只把最小环境交给 CLI，并在上传前核对路由与环境泄漏，令牌不会进入边缘函数包。
          pnpm --filter web run package:edgeone
          result="$RUNNER_TEMP/edgeone-deploy.log"
          # WHY：EdgeOne 直传项目没有分支别名，预览每次生成独立地址；项目需已有生产部署，否则 CLI 拒绝发布预览。
          # WHY：CLI 选址时中国站接口偶发失败会退到国际站，找不到项目或报令牌无效；部署后查询地址也可能 522。
          # 重新部署只会多一条同内容的部署记录，因此整体有限重试。
          for attempt in 1 2 3; do
            if pnpm --filter web exec edgeone makers deploy .edgeone -n "$EDGEONE_PROJECT" -e preview \
              -t "$EDGEONE_API_TOKEN" --json --skip-ai-gateway-sync | tee "$result"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "EdgeOne 部署连续 3 次失败" >&2
              exit 1
            fi
            echo "::warning::EdgeOne 部署第 $attempt 次失败，$((attempt * 30)) 秒后重试"
            sleep $((attempt * 30))
          done
          detail="$(jq -Rc 'fromjson? | objects | select(.status == "success")' "$result" | tail -n 1)"
          if [ -z "$detail" ]; then
            echo "EdgeOne 未返回成功的部署结果" >&2
            exit 1
          fi
          deployment_url="$(jq -er '.url' <<<"$detail")"
          echo "deployment_url=$deployment_url" >>"$GITHUB_OUTPUT"
          {
            echo "## 官网预览"
            echo "- 本次部署：$deployment_url"
            echo "- 控制台：$(jq -r '.consoleUrl // "未返回"' <<<"$detail")"
            echo "- 提交：\`$COMMIT_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Smoke test preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: node scripts/repo-tools/scripts/check-web-deploy.ts --url "$DEPLOYMENT_URL"
      - name: Update PR preview comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          marker='<!-- gazekeep-web-preview -->'
          body="$(printf '%s\n' "$marker" '### 官网预览' '' '| 项目 | 内容 |' '| --- | --- |' \
            "| 本次部署 | $DEPLOYMENT_URL |" "| 提交 | \`$COMMIT_SHA\` |" \
            '' '部署冒烟已通过；预览仅供评审，不代表真实浏览器或 WebGPU 渲染验收。链接可能带 EdgeOne 临时访问令牌，失效后以最新一次部署为准。')"
          # 原地更新同一条评论，避免每次 push 都追加新评论。
          comment_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

  web-production:
    name: Deploy website production
    needs: [app, web]
    if: >-
      !cancelled() && needs.web.result == 'success' &&
      (needs.app.result == 'success' || needs.app.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: web-production
      url: ${{ vars.GAZEKEEP_WEB_URL }}
    concurrency:
      group: web-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Download website build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Deploy to EdgeOne Makers production
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT: ${{ vars.EDGEONE_PROJECT }}
          WEB_URL: ${{ vars.GAZEKEEP_WEB_URL }}
        run: |
          set -euo pipefail
          for name in EDGEONE_API_TOKEN EDGEONE_PROJECT WEB_URL; do
            if [ -z "${!name:-}" ]; then
              echo "web-production 环境缺少配置：$name" >&2
              exit 1
            fi
          done
          pnpm --filter web run package:edgeone
          result="$RUNNER_TEMP/edgeone-deploy.log"
          # WHY：CLI 选址时中国站接口偶发失败会退到国际站，找不到项目或报令牌无效；部署后查询地址也可能 522。
          # 重新部署只会多一条同内容的部署记录，因此整体有限重试。
          for attempt in 1 2 3; do
            if pnpm --filter web exec edgeone makers deploy .edgeone -n "$EDGEONE_PROJECT" -e production \
              -t "$EDGEONE_API_TOKEN" --json --skip-ai-gateway-sync | tee "$result"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "EdgeOne 部署连续 3 次失败" >&2
              exit 1
            fi
            echo "::warning::EdgeOne 部署第 $attempt 次失败，$((attempt * 30)) 秒后重试"
            sleep $((attempt * 30))
          done
          detail="$(jq -Rc 'fromjson? | objects | select(.status == "success")' "$result" | tail -n 1)"
          if [ -z "$detail" ]; then
            echo "EdgeOne 未返回成功的部署结果" >&2
            exit 1
          fi
          {
            echo "## 官网生产发布"
            echo "- 站点：$WEB_URL"
            echo "- 本次部署：$(jq -r '.url' <<<"$detail")（$(jq -r '.type' <<<"$detail")）"
            echo "- 控制台：$(jq -r '.consoleUrl // "未返回"' <<<"$detail")"
            echo "- 提交：\`$GITHUB_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Smoke test production
        env:
          WEB_URL: ${{ vars.GAZEKEEP_WEB_URL }}
        run: node scripts/repo-tools/scripts/check-web-deploy.ts --url "$WEB_URL"
