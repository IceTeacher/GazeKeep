name: pipeline

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  # 只取消被新提交取代的 PR 运行；分支与 tag 的发布不中途打断。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# tag 发版见 release.yml：它只在本流水线已通过 main 上同一提交后构建签名 APK，不再重复回归。

jobs:
  changes:
    name: Detect changes
    # 各 job 固定 runner 镜像版本：ubuntu-latest 会随 GitHub 迁移到新系统，Android SDK、Docker 与 APK 工具随之变化。
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # 复用判断需查询本流水线的历史运行。
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.detect.outputs.app }}
      app_tasks: ${{ steps.detect.outputs.app_tasks }}
      core_web_test: ${{ steps.detect.outputs.core_web_test }}
      web: ${{ steps.detect.outputs.web }}
      web_kmp: ${{ steps.detect.outputs.web_kmp }}
      web_browser: ${{ steps.detect.outputs.web_browser }}
      full: ${{ steps.detect.outputs.full }}
      verified: ${{ steps.detect.outputs.verified }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Detect affected areas
        id: detect
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base='' head="$GITHUB_SHA" reuse=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA" head="$PR_HEAD_SHA" reuse=(--reuse)
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            base="$PUSH_BEFORE_SHA" reuse=(--reuse)
          fi
          # WHY：手动触发用于主动全量回归，不复用历史结果；空 base 由脚本按全量回归处理。
          # verified=true 表示同一棵树已有成功的 push 运行（dev 推送后开 PR、合并到 main、合并后同步 dev），
          # 此时跳过门禁构建，main 仍构建官网用于生产发布。
          node scripts/repo-tools/scripts/ci-changes.ts --base "$base" --head "$head" "${reuse[@]}" --output "$GITHUB_OUTPUT"

  # 门禁并行启动（repo 与 app / web-* 同级并发）；最终预览与生产部署仍要求全部门禁通过。
  repo:
    name: Repository checks
    needs: changes
    # PR 仍按 main 基线核对提交区间；其余已验证的树在原运行中检查过同样的提交。
    if: needs.changes.outputs.verified != 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          java: "true"
          ktlint: "true"
          turbo: "true"
      - name: Install tools and Git hooks
        run: |
          set -euo pipefail
          pnpm tools:setup
          pnpm hooks:install
          pnpm verify:hooks
      - name: Verify docs, agent assets, architecture, LSPosed metadata and tool tests
        run: >-
          pnpm exec turbo run verify:docs verify:agent-assets verify:architecture verify:lsposed-repo lint test
          --filter=@gazekeep/repo-tools
      - name: Check formatting and lint
        run: pnpm format:check
      - name: Check commit messages and whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          to="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            from="$PR_BASE_SHA" to="$PR_HEAD_SHA"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/heads/* ]] &&
            [ -n "$PUSH_BEFORE_SHA" ] && ! [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]] &&
            git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            from="$PUSH_BEFORE_SHA"
          else
            # WHY：首次推送、强推与手动触发没有可用的 before；固定到主线共同祖先，避免空基线绕过门禁。
            from="$(git merge-base origin/main "$to")"
          fi
          echo "commit range: $from..$to"
          # WHY：main 上的手动触发与主线共同祖先即自身，区间为空；这些提交已在分支推送时校验。
          if [ "$from" = "$to" ]; then
            echo "提交区间为空，跳过"
            exit 0
          fi
          pnpm verify:commits --from "$from" --to "$to"
          git diff --check "$from" "$to"

  app:
    name: Android app
    needs: changes
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.app == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          java: "true"
          gradle: "true"
          kotlin-js: ${{ needs.changes.outputs.core_web_test == 'true' && 'true' || 'false' }}
      # 仅执行受改动与依赖闭包影响的 Debug 构建、lint、主机测试与实机套件编译；实机运行不进入 CI。
      - name: Verify affected Android modules
        env:
          APP_TASKS: ${{ needs.changes.outputs.app_tasks }}
        run: |
          set -euo pipefail
          read -r -a tasks <<<"$APP_TASKS"
          node scripts/repo-tools/scripts/android-task.ts tasks "${tasks[@]}"
      - name: Run core JS and Wasm tests
        if: needs.changes.outputs.core_web_test == 'true'
        run: node scripts/repo-tools/scripts/android-task.ts core-web-test
      # Gradle 默认不输出 Yarn 日志；失败时保留 Kotlin/JS 安装目录的 Yarn 错误日志供排查。
      - name: Collect Yarn error logs
        if: failure() && needs.changes.outputs.core_web_test == 'true'
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/yarn-logs"
          mkdir -p "$dest"
          find "$HOME/.kotlin/kotlin-npm-tooling" apps/app/build/js apps/app/build/wasm -maxdepth 3 \
            \( -name yarn-error.log -o -name package.json -o -name yarn.lock \) -not -path '*/node_modules/*' \
            -exec cp --parents {} "$dest" \; 2>/dev/null || true
      - name: Upload Yarn error logs
        if: failure() && needs.changes.outputs.core_web_test == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-yarn-logs
          path: ${{ runner.temp }}/yarn-logs
          if-no-files-found: ignore
          retention-days: 7

  web-quality:
    name: Website checks
    needs: changes
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.web == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          turbo: "true"
      - name: Lint, type-check and unit test website
        run: pnpm exec turbo run lint check test:unit --filter=web

  web-browser:
    name: Website browser tests (${{ matrix.shard }}/2)
    needs: changes
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.web_browser == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup
      # 浏览器与截图测试不依赖 KMP 产物，在锁定版本的 Playwright 容器中按 2 路分片与上游并行运行。
      - name: Run browser tests in Playwright container
        run: |
          set -euo pipefail
          pnpm --filter web exec node scripts/sync-kmp-strings.ts
          pnpm --filter web exec node scripts/test-browser-docker.ts --shard=${{ matrix.shard }}/2

  web-build:
    name: Website build
    needs: changes
    # 已验证的树只在 main 上重新构建，供生产发布使用。
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.web == 'true' &&
      (needs.changes.outputs.verified != 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 精确按 KMP Showcase 全部输入哈希恢复预编译产物；命中时无需准备 JDK、Gradle 与 Kotlin/JS。
      - name: Restore KMP Showcase cache
        id: kmp-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/kmp-showcase
          key: >-
            kmp-showcase-${{ runner.os }}-${{ hashFiles('apps/app/core/**', '!apps/app/core/build/**',
            'apps/app/shared/**', '!apps/app/shared/build/**', 'apps/app/android/build.gradle.kts',
            'apps/app/gradle/**', 'apps/app/kotlin-js-store/**', 'apps/app/build.gradle.kts',
            'apps/app/settings.gradle.kts', 'apps/app/gradle.properties', 'apps/app/gradlew',
            'apps/web/scripts/build-kmp.ts', 'apps/web/scripts/kmp-preload.ts', 'apps/web/scripts/kmp-showcase.ts') }}
      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          java: ${{ steps.kmp-cache.outputs.cache-hit != 'true' && 'true' || 'false' }}
          gradle: ${{ steps.kmp-cache.outputs.cache-hit != 'true' && 'true' || 'false' }}
          kotlin-js: ${{ steps.kmp-cache.outputs.cache-hit != 'true' && 'true' || 'false' }}
          turbo: "true"
      - name: Build KMP Showcase
        if: steps.kmp-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web run build:kmp
      - name: Save KMP Showcase cache
        if: >-
          steps.kmp-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/kmp-showcase
          key: ${{ steps.kmp-cache.outputs.cache-primary-key }}
      - name: Build static site
        run: pnpm exec turbo run build:site --filter=web
      - name: Upload website build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  web-preview:
    name: Deploy website preview
    needs: [repo, app, web-quality, web-browser, web-build]
    # WHY：fork PR 拿不到 secret，只跑门禁；所有门禁通过（未触发视为通过）才发布预览。
    if: >-
      !cancelled() && needs.web-build.result == 'success' &&
      (needs.repo.result == 'success' || needs.repo.result == 'skipped') &&
      (needs.app.result == 'success' || needs.app.result == 'skipped') &&
      (needs.web-quality.result == 'success' || needs.web-quality.result == 'skipped') &&
      (needs.web-browser.result == 'success' || needs.web-browser.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: web-preview
      url: ${{ steps.deploy.outputs.deployment_url }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: web-preview-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          pnpm-filter: web
      - name: Download website build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - id: deploy
        name: Deploy preview to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT: ${{ vars.EDGEONE_PROJECT }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for name in EDGEONE_API_TOKEN EDGEONE_PROJECT; do
            if [ -z "${!name:-}" ]; then
              echo "web-preview 环境缺少配置：$name" >&2
              exit 1
            fi
          done
          # 打包脚本只把最小环境交给 CLI，并在上传前核对路由与环境泄漏，令牌不会进入边缘函数包。
          pnpm --filter web run package:edgeone
          result="$RUNNER_TEMP/edgeone-deploy.log"
          # WHY：EdgeOne 直传项目没有分支别名，预览每次生成独立地址；项目需已有生产部署，否则 CLI 拒绝发布预览。
          # WHY：CLI 选址时中国站接口偶发失败会退到国际站，找不到项目或报令牌无效；部署后查询地址也可能 522。
          # 重新部署只会多一条同内容的部署记录，因此整体有限重试。
          for attempt in 1 2 3; do
            if pnpm --filter web exec edgeone makers deploy .edgeone -n "$EDGEONE_PROJECT" -e preview \
              -t "$EDGEONE_API_TOKEN" --json --skip-ai-gateway-sync | tee "$result"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "EdgeOne 部署连续 3 次失败" >&2
              exit 1
            fi
            echo "::warning::EdgeOne 部署第 $attempt 次失败，$((attempt * 30)) 秒后重试"
            sleep $((attempt * 30))
          done
          detail="$(jq -Rc 'fromjson? | objects | select(.status == "success")' "$result" | tail -n 1)"
          if [ -z "$detail" ]; then
            echo "EdgeOne 未返回成功的部署结果" >&2
            exit 1
          fi
          deployment_url="$(jq -er '.url' <<<"$detail")"
          echo "deployment_url=$deployment_url" >>"$GITHUB_OUTPUT"
          {
            echo "## 官网预览"
            echo "- 本次部署：$deployment_url"
            echo "- 控制台：$(jq -r '.consoleUrl // "未返回"' <<<"$detail")"
            echo "- 提交：\`$COMMIT_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Smoke test preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: node scripts/repo-tools/scripts/check-web-deploy.ts --url "$DEPLOYMENT_URL"
      - name: Update PR preview comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          marker='<!-- gazekeep-web-preview -->'
          body="$(printf '%s\n' "$marker" '### 官网预览' '' '| 项目 | 内容 |' '| --- | --- |' \
            "| 本次部署 | $DEPLOYMENT_URL |" "| 提交 | \`$COMMIT_SHA\` |" \
            '' '部署冒烟已通过；预览仅供评审，不代表真实浏览器或 WebGPU 渲染验收。链接可能带 EdgeOne 临时访问令牌，失效后以最新一次部署为准。')"
          # 原地更新同一条评论，避免每次 push 都追加新评论。
          comment_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

  web-production:
    name: Deploy website production
    needs: [repo, app, web-quality, web-browser, web-build]
    if: >-
      !cancelled() && needs.web-build.result == 'success' &&
      (needs.repo.result == 'success' || needs.repo.result == 'skipped') &&
      (needs.app.result == 'success' || needs.app.result == 'skipped') &&
      (needs.web-quality.result == 'success' || needs.web-quality.result == 'skipped') &&
      (needs.web-browser.result == 'success' || needs.web-browser.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: web-production
      url: ${{ vars.GAZEKEEP_WEB_URL }}
    concurrency:
      group: web-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          pnpm-filter: web
      - name: Download website build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Deploy to EdgeOne Makers production
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT: ${{ vars.EDGEONE_PROJECT }}
          WEB_URL: ${{ vars.GAZEKEEP_WEB_URL }}
        run: |
          set -euo pipefail
          for name in EDGEONE_API_TOKEN EDGEONE_PROJECT WEB_URL; do
            if [ -z "${!name:-}" ]; then
              echo "web-production 环境缺少配置：$name" >&2
              exit 1
            fi
          done
          pnpm --filter web run package:edgeone
          result="$RUNNER_TEMP/edgeone-deploy.log"
          # WHY：CLI 选址时中国站接口偶发失败会退到国际站，找不到项目或报令牌无效；部署后查询地址也可能 522。
          # 重新部署只会多一条同内容的部署记录，因此整体有限重试。
          for attempt in 1 2 3; do
            if pnpm --filter web exec edgeone makers deploy .edgeone -n "$EDGEONE_PROJECT" -e production \
              -t "$EDGEONE_API_TOKEN" --json --skip-ai-gateway-sync | tee "$result"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "EdgeOne 部署连续 3 次失败" >&2
              exit 1
            fi
            echo "::warning::EdgeOne 部署第 $attempt 次失败，$((attempt * 30)) 秒后重试"
            sleep $((attempt * 30))
          done
          detail="$(jq -Rc 'fromjson? | objects | select(.status == "success")' "$result" | tail -n 1)"
          if [ -z "$detail" ]; then
            echo "EdgeOne 未返回成功的部署结果" >&2
            exit 1
          fi
          {
            echo "## 官网生产发布"
            echo "- 站点：$WEB_URL"
            echo "- 本次部署：$(jq -r '.url' <<<"$detail")（$(jq -r '.type' <<<"$detail")）"
            echo "- 控制台：$(jq -r '.consoleUrl // "未返回"' <<<"$detail")"
            echo "- 提交：\`$GITHUB_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Smoke test production
        env:
          WEB_URL: ${{ vars.GAZEKEEP_WEB_URL }}
        run: node scripts/repo-tools/scripts/check-web-deploy.ts --url "$WEB_URL"
