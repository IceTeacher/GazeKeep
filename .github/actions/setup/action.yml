name: 准备工作区
description: 安装锁定版本的 Node、pnpm 与依赖；按需准备 JDK 21 与 Gradle 缓存。
inputs:
  java:
    description: 是否准备 JDK 21（ktlint、Gradle 与 KMP 构建需要）
    default: "false"
  gradle:
    description: 是否启用 Gradle 缓存
    default: "false"
runs:
  using: composite
  steps:
    # 不指定版本，读取根 package.json 的 packageManager，避免与本地锁定版本分叉。
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    # Gradle daemon JVM 条件锁定 Azul 21；使用同厂商发行版可避免 Gradle 再下载一份工具链。
    - if: inputs.java == 'true'
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: zulu
        java-version: 21
    - if: inputs.gradle == 'true'
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
    - shell: bash
      run: pnpm install --frozen-lockfile
